  <div id="instalar">
    <p><b>Para tener el ícono de la flor en el iPhone:</b></p>
    <ol>
      <li>Abrí esta página en <b>Safari</b>.</li>
      <li>Tocá <b>Compartir</b> (el cuadrado con la flecha).</li>
      <li>Elegí <b>“Agregar a inicio”</b> y tocá <b>Agregar</b>.</li>
    </ol>
    <p style="margin-top:8px">Desde ese ícono se abre directo el panel.</p>

<script>
  // Enlace al panel en Claude
  var PANEL = "https://claude.ai/artifact/EaZ1ewz4W56x3pqE2ZHwzM";
  var desdeInicio = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  var quedarse = location.hash === "#instalar";
  function ir(){ location.replace(PANEL); }
  function mostrarInstalar(){
    clearTimeout(t); quedarse = true;
    document.getElementById("instalar").style.display = "block";
    document.getElementById("verInstalar").style.display = "none";
    document.getElementById("estado").textContent = "Esta página te lleva al panel de gestión del salón.";
  }
  var t;
  if (desdeInicio) { ir(); }                 // abierto desde el ícono: directo al panel
  else if (quedarse) { setTimeout(mostrarInstalar, 0); }
  else { t = setTimeout(ir, 900); }           // abierto desde el enlace: entra solo
  document.getElementById("verInstalar").addEventListener("click", mostrarInstalar);
</script>
